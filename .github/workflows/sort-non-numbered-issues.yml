name: Sort Non-Numbered Issues to Annexe

on:
  issues:
    types: [opened]

jobs:
  route-to-annexe:
    runs-on: ubuntu-latest
    # Only run if title does NOT start with a digit
    if: "!startsWith(github.event.issue.title, '0') && !startsWith(github.event.issue.title, '1') && !startsWith(github.event.issue.title, '2') && !startsWith(github.event.issue.title, '3') && !startsWith(github.event.issue.title, '4') && !startsWith(github.event.issue.title, '5') && !startsWith(github.event.issue.title, '6') && !startsWith(github.event.issue.title, '7') && !startsWith(github.event.issue.title, '8') && !startsWith(github.event.issue.title, '9')"
    env:
      PROJECT_URL: "https://github.com/users/KarlJosvah/projects/3"
    permissions:
      contents: read
      issues: write
    steps:
      - name: Add issue to Project and get Item ID
        id: add-to-project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ env.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_PAT }}

      - name: Move item status to Annexe
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const itemId = "${{ steps.add-to-project.outputs.itemId }}";
            const projectUrl = "${{ env.PROJECT_URL }}";

            // Extract project number and scope (org/user)
            const isOrg = projectUrl.includes('/orgs/');
            const owner = projectUrl.split('/')[4];
            const projectNumber = parseInt(projectUrl.split('/')[6], 10);

            // Fetch field definition for 'Status' to get Field ID and 'Annexe' Option ID
            const queryFieldData = isOrg ? `
              query($owner: String!, $number: Int!) {
                organization(login: $owner) {
                  projectV2(number: $number) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            ` : `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            `;

            const fieldResult = await github.graphql(queryFieldData, { owner, number: projectNumber });
            const projectData = isOrg ? fieldResult.organization.projectV2 : fieldResult.user.projectV2;

            const statusField = projectData.field;
            const annexeOption = statusField.options.find(opt => opt.name === "Annexe");

            if (!annexeOption) {
              throw new Error("Could not find status option 'Annexe' in the project status field.");
            }

            // Update Status via GraphQL
            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $singleSelectOptionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: {
                      singleSelectOptionId: $singleSelectOptionId
                    }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            await github.graphql(updateMutation, {
              projectId: projectData.id,
              itemId: itemId,
              fieldId: statusField.id,
              singleSelectOptionId: annexeOption.id
            });

            console.log(`Updated issue status to 'Annexe' for project item ID ${itemId}.`);
