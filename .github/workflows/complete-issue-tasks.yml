name: Complete Tasks on Issue Close

on:
  issues:
    types: [closed]

jobs:
  complete-tasks:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update unchecked tasks in issue body
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;
            const body = context.payload.issue.body || '';

            if (body.includes('[ ]')) {
              const updatedBody = body.replace(/\[ \]/g, '[x]');

              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                body: updatedBody
              });

              console.log(`Successfully updated issue #${issue_number}: all unchecked tasks were checked.`);
            } else {
              console.log(`No unchecked tasks found in issue #${issue_number}.`);
            }
